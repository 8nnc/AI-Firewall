name: Android Build and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set Gradle executable
        run: chmod +x ./gradlew

      - name: Clean generated build outputs
        run: ./gradlew clean --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Create temporary release keystore
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/release.keystore"             -storetype JKS             -alias github-release             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "github-actions-store-password"             -keypass "github-actions-key-password"             -dname "CN=AI Firewall CI, OU=CI, O=AI Firewall, L=Global, ST=Global, C=US"

          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=github-actions-store-password" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=github-release" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=github-actions-key-password" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK files
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/*.apk
          test -s app/build/outputs/apk/release/*.apk
          echo "Debug APK:"
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "Release APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Firewall-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Firewall-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Firewall-lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
